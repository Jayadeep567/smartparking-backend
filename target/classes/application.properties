server.port=8080

# ---- Default: in-memory H2 (zero setup) ----
spring.datasource.url=jdbc:h2:mem:parkingdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# ---- To use MySQL instead, comment the H2 block above and uncomment: ----
# spring.datasource.url=jdbc:mysql://localhost:3306/parkingdb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.hibernate.ddl-auto=update
